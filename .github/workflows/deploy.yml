name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build web
        run: |
          set -e
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          OWNER_NAME="${{ github.repository_owner }}"
          if [ "$REPO_NAME" = "$OWNER_NAME.github.io" ]; then
            BASE_HREF="/"
          else
            BASE_HREF="/$REPO_NAME/"
          fi
          echo "Building for repository: $REPO_NAME"
          echo "Using base href: $BASE_HREF"
          echo "Flutter version:"
          flutter --version
          echo "Analyzing code..."
          flutter analyze --no-fatal-infos || true
          echo "Building web..."
          flutter build web --release --base-href "$BASE_HREF"
          touch build/web/.nojekyll
          cat > build/web/404.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="robots" content="noindex">
            <title>TuneX</title>
            <script>
              (function () {
                var baseHref = "$BASE_HREF";
                var path = window.location.pathname;
                var route = "/";

                if (baseHref !== "/" && path.indexOf(baseHref) === 0) {
                  route = path.slice(baseHref.length - 1) || "/";
                } else if (baseHref === "/") {
                  route = path || "/";
                }

                var target = baseHref + "#" + route + window.location.search + window.location.hash;
                window.location.replace(target);
              }());
            </script>
          </head>
          <body>
            <a href="$BASE_HREF">TuneX'e don</a>
          </body>
          </html>
          EOF
          echo "Build successful!"

      - name: Verify build output
        run: |
          set -e
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          OWNER_NAME="${{ github.repository_owner }}"
          if [ "$REPO_NAME" = "$OWNER_NAME.github.io" ]; then
            BASE_HREF="/"
          else
            BASE_HREF="/$REPO_NAME/"
          fi
          if [ ! -d "build/web" ]; then
            echo "build/web directory not found!"
            exit 1
          fi
          test -f build/web/index.html
          test -f build/web/404.html
          test -f build/web/.nojekyll
          test -f build/web/flutter_bootstrap.js
          grep -q "<base href=\"$BASE_HREF\">" build/web/index.html
          grep -q "window.location.replace" build/web/404.html
          grep -q '"scope": "."' build/web/manifest.json
          echo "build/web directory exists"
          ls -la build/web/ | head -20
          echo "File count: $(find build/web -type f | wc -l)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
